name: CI

on:
  workflow_call:
    inputs:
      full:
        description: Test the full Python matrix (3.10-3.13) instead of just latest
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f226477cf6208c3824ce69a8a4b0255039591272 # v6.3
        with:
          enable-cache: true
      - run: uv run --extra dev -- ruff check hiktemp/ tests/
      - run: uv run --extra dev -- ruff format --check hiktemp/ tests/

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ inputs.full && fromJSON('["3.10", "3.11", "3.12", "3.13"]') || fromJSON('["3.13"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f226477cf6208c3824ce69a8a4b0255039591272 # v6.3
        with:
          enable-cache: true
      - run: uv run --extra dev --python "${{ matrix.python }}" -- pytest tests/ -q

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f226477cf6208c3824ce69a8a4b0255039591272 # v6.3
        with:
          enable-cache: true
      - run: uv build
      - run: uv run --with twine -- twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
