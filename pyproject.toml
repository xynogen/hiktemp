[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiktemp"
version = "0.2.0"
description = "Minimal radiometric temperature extraction from Hikvision thermal cameras"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "xynogen" }]
keywords = [
  "hikvision",
  "thermal-camera",
  "isapi",
  "radiometric",
  "temperature",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = ["requests>=2.28", "numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/xynogen/hiktemp"
Repository = "https://github.com/xynogen/hiktemp"
Issues = "https://github.com/xynogen/hiktemp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hiktemp*"]

# ─── Ruff ────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["hiktemp", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hiktemp"]

# ─── Pytest ──────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
